# Checks every pull request and every push to master: lint, a syntax check
# of every source file, the pricing checks, and the checkout tests against a
# throwaway PostgreSQL in a container (test/support/testdb.js). Nothing here
# deploys, and nothing here can reach the live database. It can also be run
# by hand (Actions → ci → Run workflow), for when GitHub drops a push event.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Syntax check
        run: |
          for f in $(git ls-files 'src/*.js' '*.mjs'); do
            node --check "$f"
          done
      - run: npm test
