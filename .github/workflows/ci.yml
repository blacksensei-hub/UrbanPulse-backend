# Checks every pull request and every push to master: the pricing checks,
# and a syntax check of every source file. Nothing here deploys.
#
# Lint isn't run: ESLint is installed but has no config yet.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for f in $(git ls-files 'src/*.js' '*.mjs'); do
            node --check "$f"
          done
      - run: npm test
